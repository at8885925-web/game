<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لعبة XO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>لعبة XO</h1>

    <div class="players">
      <label>
        اللاعب X
        <input id="playerX" type="text" placeholder="اسم اللاعب X" value="لاعب ١">
      </label>
      <label>
        اللاعب O
        <input id="playerO" type="text" placeholder="اسم اللاعب O" value="لاعب ٢">
      </label>
    </div>

    <div class="scoreboard">
      <div class="score">
        <span class="score-label">X</span>
        <span id="scoreX">0</span>
      </div>
      <div class="score">
        <span class="score-label">O</span>
        <span id="scoreO">0</span>
      </div>
      <div class="score">
        <span class="score-label">تعادلات</span>
        <span id="scoreDraw">0</span>
      </div>
    </div>

    <div class="status">
      الدور الحالي: <span id="currentPlayer">X</span>
    </div>

    <div class="board" id="board">
      <!-- 9 مربعات -->
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="result" id="result"></div>

    <div class="actions">
      <button id="resetBtn">جولة جديدة</button>
      <button id="resetAllBtn" class="ghost">تصفير النتائج</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
